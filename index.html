<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<title>彰嘉雲兩天一夜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one narrow column; a tab bar switches between the itinerary and the shared expense book */
:root{
  --bg:#f3f6f1; --card:#ffffff; --fg:#1f2a24; --muted:#5f6f66; --line:#dde5dc;
  --accent:#2f7d5b; --accent-ink:#ffffff; --sun:#e8a33a; --soft:#e4efe7;
  --plus:#2f7d5b; --minus:#c2452f;
  --f-body:"Noto Sans TC",system-ui,sans-serif; --f-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121a16; --card:#1b2520; --fg:#e7efe9; --muted:#9db0a5; --line:#2a3832;
  --accent:#4fb487; --accent-ink:#0d1a13; --sun:#f0b752; --soft:#20332a;
  --plus:#5cc795; --minus:#f07a62; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header h1{font-size:26px;font-weight:900;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:transparent;color:var(--fg);font:inherit;font-weight:700;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bring{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
section{display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:20px;font-weight:900}
h2 span{color:var(--accent);font-family:var(--f-num);margin-right:6px}
.route{color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
ol,ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.time{font-family:var(--f-num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;
  background:transparent;border:1px dashed var(--line);border-radius:8px;color:var(--fg);padding:4px 6px;width:5.6em}
.info{min-width:0}
.name{font-weight:700;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--sun);border:1px solid var(--sun);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.note{color:var(--muted);font-size:13px;margin-top:2px}
.go{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;border-radius:12px;padding:12px 14px;font-size:15px;white-space:nowrap;border:0;cursor:pointer}
.go.nomap{background:transparent;color:var(--muted);border:1px solid var(--line);padding:11px 13px;font-weight:500}
.alt{border-style:dashed}
.alt .go{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:10.5px 12.5px}
.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick .x{margin-left:6px;opacity:.6}
.muted{color:var(--muted);font-size:13px}
.exp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.exp .amt{font-family:var(--f-num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.exp .meta{color:var(--muted);font-size:13px;min-width:0}
.exp .del{background:transparent;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 0;justify-self:end}
.exp .del.confirm{color:var(--minus);font-weight:700}
.bal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.bal .v{font-family:var(--f-num);font-weight:600;text-align:right}
.pos{color:var(--plus)} .neg{color:var(--minus)}
.xfer{font-weight:700;font-size:17px}
.xfer b{font-family:var(--f-num);color:var(--accent)}
.banner{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
[hidden]{display:none!important}
@media (max-width:380px){.stop{grid-template-columns:1fr auto}.time{grid-column:1/-1;justify-self:start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>彰化 → 嘉義 → 雲林 兩天一夜</h1>
    <p>點綠色「導航」直接開 Google Maps。花錢記在「記帳」，最後自動算誰給誰多少。</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-plan" aria-selected="true">行程</button>
    <button role="tab" id="tab-money" aria-selected="false">記帳</button>
  </div>

  <div id="view-plan">
    <div class="bring"><span class="chip">泳具（古生物樂園玩水）</span><span class="chip">玩沙工具（史堤克）</span><span class="chip">小孩泳衣先試穿</span></div>
    <div id="days" style="display:flex;flex-direction:column;gap:24px;margin-top:16px"></div>
    <p class="muted" style="margin-top:16px">時間是建議的，點一下可以改（只記在你這支手機）。</p>
  </div>

  <div id="view-money" hidden style="display:flex;flex-direction:column;gap:20px">
    <div class="banner" id="offline" hidden>還沒連上共用帳本，現在記的只會存在這支手機。</div>

    <section>
      <h2>成員</h2>
      <div class="picks" id="members"></div>
      <form id="memForm" class="row" style="grid-template-columns:1fr auto">
        <label class="f"><span>新增成員</span><input id="memName" maxlength="20" placeholder="例如：老婆" autocomplete="off"></label>
        <button class="ghost" style="align-self:end;height:46px">加入</button>
      </form>
    </section>

    <section>
      <h2>記一筆</h2>
      <form id="expForm" class="panel">
        <label class="f"><span>項目</span><input id="expItem" maxlength="40" placeholder="例如：葉子庭園晚餐" autocomplete="off"></label>
        <div class="row">
          <label class="f"><span>金額（元）</span><input id="expAmt" type="number" inputmode="numeric" min="1" step="1" placeholder="0"></label>
          <label class="f"><span>誰先付</span><select id="expPayer"></select></label>
        </div>
        <div class="f"><span>誰要分（點一下取消）</span><div class="picks" id="sharePicks"></div></div>
        <button class="go" id="expSubmit">記下來</button>
        <div class="status" id="status" role="status"></div>
      </form>
    </section>

    <section>
      <div class="dayhead"><h2>結算</h2><button class="ghost" id="copyBtn" type="button">複製到 LINE</button></div>
      <div class="panel">
        <ul id="xfers"></ul>
        <div class="bal" id="bal"></div>
      </div>
    </section>

    <section>
      <div class="dayhead"><h2>明細</h2><span class="muted" id="total"></span></div>
      <ul id="exps"></ul>
    </section>
  </div>
</div>

<script>
// 部署好 Google Apps Script 後，把網頁應用程式網址貼在這裡
const API_URL = "https://script.google.com/macros/s/AKfycbxnOQDh5aNiDMqmR6hrcfBVv0QGLkVlNVaucBntLywZoq1qfmI9SM_4Dg8GsJzf4Ylz/exec";

/* ---------- 行程 ---------- */
const DAYS=[
  {n:"Day 1",title:"彰化 → 嘉義",stops:[
    {id:"a1",t:"10:30",name:"阿泉爌肉飯",q:"阿泉爌肉飯 彰化",note:"外帶去樂園吃"},
    {id:"a2",t:"11:30",name:"彰化古生物奇幻樂園",q:"古生物奇幻樂園 彰化",note:"午餐在樂園吃・有玩水區"},
    {id:"a3",t:"16:30",name:"嘉義天成文旅 Check in",q:"天成文旅 繪日之丘 嘉義",note:"有溜滑梯親子房"},
    {id:"a4",t:"18:00",name:"葉子庭園餐廳",q:"葉子庭園餐廳 嘉義",note:"晚餐・蘭潭旁親子餐廳"},
    {id:"a5",t:"19:30",name:"回飯店玩設施",q:"",note:"飯店有宵夜"}
  ]},
  {n:"Day 2",title:"嘉義 → 雲林",stops:[
    {id:"b1",t:"08:00",name:"飯店早餐",q:"",note:""},
    {id:"b2",t:"09:30",name:"新嘉大昆蟲館",q:"嘉大昆蟲館 新港",note:""},
    {id:"b3",t:"12:00",name:"史堤克先生牛排 虎尾店",q:"史堤克先生牛排 親子園區 虎尾",note:"午餐・離千巧谷約 16 分鐘"},
    {id:"b3b",t:"12:00",name:"糖泊虎庭園餐廳",q:"糖泊虎庭園餐廳",note:"離千巧谷約 24 分鐘",alt:true},
    {id:"b4",t:"14:00",name:"千巧谷牛樂園牧場",q:"千巧谷牛樂園牧場 古坑",note:""}
  ]}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nav=q=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(q);
function routeUrl(stops){
  const qs=stops.filter(s=>s.q&&!s.alt).map(s=>s.q);
  const dest=qs.pop();
  let u=nav(dest);
  if(qs.length)u+="&waypoints="+qs.map(encodeURIComponent).join("%7C");
  return u;
}
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const times=load("trip-times",{});
const daysEl=document.getElementById("days");
DAYS.forEach(d=>{
  const sec=document.createElement("section");
  sec.innerHTML=`<div class="dayhead"><h2><span>${d.n}</span>${d.title}</h2>
    <a class="route" href="${routeUrl(d.stops)}" target="_blank" rel="noopener">整天路線 ↗</a></div><ol></ol>`;
  const ol=sec.querySelector("ol");
  d.stops.forEach(s=>{
    const li=document.createElement("li");
    li.className="stop"+(s.alt?" alt":"");
    li.innerHTML=`<input class="time" type="time" id="t-${s.id}" value="${times[s.id]||s.t}" aria-label="${s.name} 時間">
      <div class="info"><div class="name">${s.name}${s.alt?'<span class="tag">備案</span>':''}</div>${s.note?`<div class="note">${s.note}</div>`:''}</div>
      ${s.q?`<a class="go" href="${nav(s.q)}" target="_blank" rel="noopener">導航</a>`:'<span class="go nomap">飯店內</span>'}`;
    li.querySelector("input").addEventListener("change",e=>{times[s.id]=e.target.value;save("trip-times",times)});
    ol.appendChild(li);
  });
  daysEl.appendChild(sec);
});

/* ---------- 分頁 ---------- */
const tabs={plan:document.getElementById("tab-plan"),money:document.getElementById("tab-money")};
function show(name){
  for(const k in tabs){tabs[k].setAttribute("aria-selected",k===name);document.getElementById("view-"+k).hidden=k!==name}
  save("trip-tab",name);
  if(name==="money")refresh();
}
tabs.plan.onclick=()=>show("plan");
tabs.money.onclick=()=>show("money");

/* ---------- 記帳資料 ---------- */
let state={members:[],expenses:[]};
let shares=null; // 目前勾選要分的人（null = 全部）
const statusEl=document.getElementById("status");
const online=!!API_URL;
document.getElementById("offline").hidden=online;

async function api(body){
  if(!online){ // 沒有後端時存在本機
    const s=load("trip-book",{members:[],expenses:[]});
    if(body){
      if(body.action==="add")s.expenses.push(body.expense);
      if(body.action==="delete")s.expenses=s.expenses.filter(x=>x.id!==body.id);
      if(body.action==="addMember"&&!s.members.includes(body.name))s.members.push(body.name);
      if(body.action==="removeMember")s.members=s.members.filter(m=>m!==body.name);
      save("trip-book",s);
    }
    return s;
  }
  const r=await fetch(API_URL,body?{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}:{cache:"no-store"});
  const j=await r.json();
  if(j.error)throw new Error(j.error);
  return j;
}
async function run(body,msg){
  statusEl.textContent=body?"儲存中…":"";
  try{state=await api(body);render();statusEl.textContent=msg||""}
  catch(e){statusEl.textContent="沒有存到："+(e.message||"網路不穩")+"，請再按一次。"}
}
const refresh=()=>run(null);

function settle(){
  const bal={};state.members.forEach(m=>bal[m]=0);
  state.expenses.forEach(x=>{
    const n=x.shares.length;if(!n)return;
    bal[x.payer]=(bal[x.payer]||0)+x.amount;
    x.shares.forEach(s=>bal[s]=(bal[s]||0)-x.amount/n);
  });
  const cred=[],debt=[];
  for(const k in bal){const v=Math.round(bal[k]);if(v>0)cred.push([k,v]);if(v<0)debt.push([k,-v])}
  cred.sort((a,b)=>b[1]-a[1]);debt.sort((a,b)=>b[1]-a[1]);
  const xf=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const p=Math.min(debt[i][1],cred[j][1]);
    if(p>0)xf.push([debt[i][0],cred[j][0],p]);
    debt[i][1]-=p;cred[j][1]-=p;
    if(!debt[i][1])i++;if(!cred[j][1])j++;
  }
  return {bal,xf};
}
const money=n=>"$"+Math.round(n).toLocaleString("zh-TW");

function render(){
  const ms=state.members;
  if(shares)shares=shares.filter(s=>ms.includes(s));
  const used=new Set(state.expenses.flatMap(x=>[x.payer,...x.shares]));
  document.getElementById("members").innerHTML=ms.length?ms.map(m=>
    `<span class="pick" style="cursor:default">${esc(m)}${used.has(m)?"":`<button type="button" class="x" data-rm="${esc(m)}" aria-label="移除 ${esc(m)}" style="background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 4px">✕</button>`}</span>`).join("")
    :'<span class="muted">先加入一起去的人（大人小孩都可以加）。</span>';
  const payer=document.getElementById("expPayer"),prev=payer.value||load("trip-me","");
  payer.innerHTML=ms.map(m=>`<option${m===prev?" selected":""}>${esc(m)}</option>`).join("");
  const sel=shares||ms;
  document.getElementById("sharePicks").innerHTML=ms.map(m=>
    `<button type="button" class="pick" data-share="${esc(m)}" aria-pressed="${sel.includes(m)}">${esc(m)}</button>`).join("");

  const ex=[...state.expenses].reverse();
  const total=state.expenses.reduce((a,x)=>a+x.amount,0);
  document.getElementById("total").textContent=ex.length?`共 ${ex.length} 筆・${money(total)}`:"";
  document.getElementById("exps").innerHTML=ex.length?ex.map(x=>`<li class="exp">
      <div class="name">${esc(x.item||"（沒寫項目）")}</div><div class="amt">${money(x.amount)}</div>
      <div class="meta">${esc(x.payer)} 付・${x.shares.length===ms.length?"大家分":esc(x.shares.join("、"))+" 分"}</div>
      <button type="button" class="del" data-del="${esc(x.id)}">刪除</button></li>`).join("")
    :'<li class="muted">還沒有記任何一筆。</li>';

  const {bal,xf}=settle();
  document.getElementById("xfers").innerHTML=xf.length?xf.map(([a,b,p])=>
    `<li class="xfer">${esc(a)} → ${esc(b)} <b>${money(p)}</b></li>`).join(""):'<li class="muted">目前沒有人需要轉帳。</li>';
  document.getElementById("bal").innerHTML=Object.keys(bal).length?Object.entries(bal).map(([k,v])=>{
    const r=Math.round(v);return `<span>${esc(k)}</span><span class="v ${r>0?"pos":r<0?"neg":""}">${r>0?"多付 ":r<0?"要出 ":""}${money(Math.abs(r))}</span>`}).join(""):"";
}

document.getElementById("memForm").onsubmit=e=>{
  e.preventDefault();
  const el=document.getElementById("memName"),name=el.value.trim();
  if(!name)return;el.value="";
  run({action:"addMember",name},"已加入 "+name);
};
document.getElementById("members").onclick=e=>{
  const b=e.target.closest("[data-rm]");if(b)run({action:"removeMember",name:b.dataset.rm});
};
document.getElementById("sharePicks").onclick=e=>{
  const b=e.target.closest("[data-share]");if(!b)return;
  const m=b.dataset.share,cur=shares||[...state.members];
  shares=cur.includes(m)?cur.filter(x=>x!==m):[...cur,m];
  render();
};
document.getElementById("expPayer").onchange=e=>save("trip-me",e.target.value);
document.getElementById("expForm").onsubmit=e=>{
  e.preventDefault();
  const item=document.getElementById("expItem").value.trim();
  const amount=Math.round(Number(document.getElementById("expAmt").value));
  const payer=document.getElementById("expPayer").value;
  const sh=shares||[...state.members];
  if(!state.members.length){statusEl.textContent="請先在上面加入成員。";return}
  if(!(amount>0)){statusEl.textContent="請填金額。";return}
  if(!sh.length){statusEl.textContent="至少要選一個人分。";return}
  const expense={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),item,amount,payer,shares:sh};
  document.getElementById("expItem").value="";document.getElementById("expAmt").value="";shares=null;
  run({action:"add",expense},"已記下："+(item||"一筆")+" "+money(amount));
};
document.getElementById("exps").onclick=e=>{
  const b=e.target.closest("[data-del]");if(!b)return;
  if(!b.classList.contains("confirm")){b.classList.add("confirm");b.textContent="確定刪除？";setTimeout(()=>{b.classList.remove("confirm");b.textContent="刪除"},3000);return}
  run({action:"delete",id:b.dataset.del},"已刪除");
};
document.getElementById("copyBtn").onclick=async()=>{
  const {xf}=settle();
  const total=state.expenses.reduce((a,x)=>a+x.amount,0);
  const text="【彰嘉雲旅遊結算】\n總花費 "+money(total)+"\n"+(xf.length?xf.map(([a,b,p])=>`${a} → ${b} ${money(p)}`).join("\n"):"不用轉帳")+"\n明細："+location.href;
  try{await navigator.clipboard.writeText(text);statusEl.textContent=""; document.getElementById("copyBtn").textContent="已複製"}
  catch(e){prompt("複製下面的文字",text)}
  setTimeout(()=>document.getElementById("copyBtn").textContent="複製到 LINE",2000);
};
setInterval(()=>{if(!document.hidden&&!document.getElementById("view-money").hidden)refresh()},20000);
show(load("trip-tab","plan"));
</script>
</body>
</html>
